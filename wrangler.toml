# Wrangler configuration for the taku-atelier Cloudflare Worker.
#
# Deployed via Cloudflare Workers Builds (Git integration), which runs
# `npx wrangler deploy` on every push. This uses the unified Workers +
# static assets model: `main` points at the Worker script that handles
# the /api/contact route and falls back to the ASSETS binding for
# everything else; `[assets]` points at the static site output directory.
#
# IMPORTANT: `name` must exactly match the Worker project name registered
# in the Cloudflare dashboard, or Workers Builds deployments will fail.
name = "taku-atelier-553"
main = "src/index.js"
compatibility_date = "2026-10-22"

[assets]
directory = "static"
binding = "ASSETS"

# Email Sending Workers binding used by src/index.js to deliver
# contact-form submissions to support@taku-atelier.com. The destination is
# restricted to that single address. support@taku-atelier.com must already
# be a verified destination address (it is, via Cloudflare Email Routing),
# and taku-atelier.com must be onboarded as a sending domain in Cloudflare
# Email Service before this binding will work.
[[send_email]]
name = "EMAIL"
destination_address = "support@taku-atelier.com"
# ...
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
# ...


